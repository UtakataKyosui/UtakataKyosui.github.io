name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # メインブランチに合わせてください

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Copy markdown files from Obsidian to docs
        run: |
          rsync -av --exclude='.git' ./obsidian/public/ ./docs/

      - name: Ensure intro.md exists
        run: |
          if [ ! -f "./docs/intro.md" ]; then
            cat << 'EOF' > ./docs/intro.md
            ---
            id: intro
            title: はじめに
            sidebar_position: 1
            ---

            # ようこそ 🎉

            このドキュメントは、プロジェクトの概要や使い方、開発のヒントなどをわかりやすくまとめたものです。

            :::tip
            ここから順番に読み進めていくことで、プロジェクトの全体像がつかめるようになっています！
            :::

            ## 次に読みたいページ

            - [セットアップ手順](./setup)
            - [機能の紹介](./features)
            - [よくある質問](./faq)

            ---

            > 💡 このページは `docs/intro.md` によって提供されています。自由に編集して、あなたのプロジェクトに合わせた内容にしてね！
            EOF
          fi
      - name: Build Docusaurus
        run: yarn build

      - name: Build Docusaurus
        run: yarn build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
