name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # メインブランチに合わせてください

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          github_token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install

      - name: Sync Obsidian public docs
        run: |
          mkdir -p docs
          cp -r Utakata-Obsidian/public/* docs/

      - name: Generate docs/intro.md if not present
        run: |
          if [ ! -f docs/intro.md ]; then
            echo "# ようこそ" > docs/intro.md
            echo "" >> docs/intro.md
            echo "これは Obsidian の公開ページです。" >> docs/intro.md
          fi

      - name: Build Docusaurus site
        run: yarn build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build